<head>

<style>
:root{--navy:#1f3864;--navy2:#2a4a7f;--gold:#b8860b;--green:#1f7a44;--red:#c0392b;--ink:#222;--mut:#6b7280;--line:#e3e7ee;--bg:#f4f6f9;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif;color:var(--ink);}
.top{background:var(--navy);color:#fff;padding:24px 20px;text-align:center;}
.top h1{margin:0;font-size:21px;font-weight:800;}
.top p{margin:7px 0 0;font-size:13px;color:#cfd9ec;}
.wrap{max-width:560px;margin:0 auto;padding:26px 16px 44px;}
.card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 3px 12px rgba(0,0,0,.07);display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
.ico{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;background:#e6f7f3;flex-shrink:0;}
.body{flex:1;min-width:190px;}
.body h3{margin:0 0 5px;font-size:17px;color:var(--navy);}
.body p{margin:0;font-size:13px;color:#555;line-height:1.55;}
.dl{background:var(--navy);color:#fff;border:none;border-radius:10px;padding:13px 22px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;}
.steps{background:#fff;border-radius:12px;padding:16px 18px;font-size:12.5px;line-height:1.85;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-top:16px;color:#444;}
.foot{text-align:center;font-size:11.5px;color:var(--mut);margin-top:22px;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;}
.modal.on{display:flex;}
.mbox{background:#fff;border-radius:14px;padding:24px;width:100%;max-width:340px;text-align:center;}
.mbox h3{margin:0 0 4px;font-size:17px;color:var(--navy);}
.mbox p{margin:0 0 16px;font-size:12.5px;color:#777;}
.mbox input{width:100%;font-family:inherit;font-size:17px;font-weight:700;text-align:center;letter-spacing:3px;padding:12px;border:1.6px solid #d6dbe4;border-radius:9px;text-transform:uppercase;}
.mbox input:focus{outline:none;border-color:var(--navy);}
.merr{font-size:12.5px;color:var(--red);font-weight:700;min-height:18px;margin:9px 0 0;}
.mbtns{display:flex;gap:8px;margin-top:12px;}
.mbtns button{flex:1;border:none;border-radius:9px;padding:12px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;}
.mbtns .ok{background:var(--navy);color:#fff;} .mbtns .no{background:#eef1f6;color:var(--navy);}
</style>
</head>

<div class="top">
  <h1>🔒 진짜 둘 · 근태 관리</h1>
  <p>다운로드 버튼을 누르고 인증 코드를 입력하세요 · 받은 파일은 더블클릭으로 실행</p>
</div>

  <div class="card">

    <div class="body"><h3>근태·급여 관리</h3><p>직원 출퇴근, 지각·조퇴 자동 판정, 월별 급여 집계, 인사기록카드 (로컬 저장).</p></div>

let pending=null;
function b64(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function ask(){pending='att';document.getElementById('m-name').textContent=PAYLOADS[pending].name+' 다운로드';document.getElementById('m-err').textContent='';document.getElementById('m-code').value='';document.getElementById('modal').classList.add('on');setTimeout(()=>document.getElementById('m-code').focus(),50);}
function closeModal(){document.getElementById('modal').classList.remove('on');pending=null;}
document.getElementById('m-code').addEventListener('keydown',e=>{if(e.key==='Enter')submitCode();});
async function deriveKey(code,saltB64){
  const baseKey=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(saltB64),iterations:100000,hash:'SHA-256'},baseKey,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function submitCode(){
  if(!pending)return;
  const code=document.getElementById('m-code').value.trim();
  const err=document.getElementById('m-err');err.style.color='var(--red)';err.textContent='확인 중...';
  const p=PAYLOADS[pending];
  try{
    const key=await deriveKey(code,p.salt);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.iv)},key,b64(p.ct));
    const html=new TextDecoder().decode(pt);
    const blob=new Blob([html],{type:'text/html'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=p.name;document.body.appendChild(a);a.click();a.remove();
    err.style.color='var(--green)';err.textContent='다운로드되었습니다.';
    setTimeout(closeModal,900);
  }catch(e){err.style.color='var(--red)';err.textContent='코드가 올바르지 않습니다.';}
}
</script>
