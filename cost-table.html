<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FNBHERO 원가표 (로컬)</title>
<style>
:root{--navy:#1f3864;--navy2:#2a4a7f;--gold:#b8860b;--red:#c0392b;--green:#1f7a44;
      --ink:#222;--mut:#6b7280;--line:#e3e7ee;--bg:#f4f6f9;}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
body{margin:0;background:var(--bg);font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif;color:var(--ink);}
.top{background:var(--navy);color:#fff;padding:13px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.top .t{font-size:16px;font-weight:800;}
.top .btns{margin-left:auto;display:flex;gap:7px;}
.top button{background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:6px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.wrap{max-width:1120px;margin:0 auto;padding:16px;}
.tabs{display:flex;gap:6px;margin:14px 0;}
.tabs button{flex:1;background:#fff;border:1.4px solid var(--line);border-radius:9px;padding:11px;font-size:14px;font-weight:800;color:var(--mut);cursor:pointer;font-family:inherit;}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.card{background:#fff;border-radius:12px;padding:16px 18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.card h3{margin:0 0 10px;font-size:14.5px;color:var(--navy);}
.hint{font-size:11.5px;color:var(--mut);margin-bottom:12px;line-height:1.6;}
.mini{background:#eef1f6;color:var(--navy);border:none;border-radius:7px;padding:8px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
.save{background:var(--navy);color:#fff;border:none;border-radius:7px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--navy);color:#fff;padding:9px 6px;font-weight:700;white-space:nowrap;}
td{border-bottom:1px solid var(--line);padding:0;}
td.p{padding:8px 6px;}
td input,td select{width:100%;border:none;background:transparent;font-family:inherit;font-size:13px;padding:9px 8px;}
td input:focus,td select:focus{outline:none;background:#eef9f4;}
td.n input{text-align:right;font-variant-numeric:tabular-nums;}
td.calc{text-align:right;padding:9px 8px;font-weight:700;color:var(--navy);background:#f7fbf9;font-variant-numeric:tabular-nums;white-space:nowrap;}
td.c{text-align:center;}
.rm{background:none;border:none;color:#c9ccd2;font-size:15px;font-weight:800;cursor:pointer;padding:4px 8px;}
.rm:hover{color:var(--red);}
tbody tr:hover td{background:#f9fbfd;}
tbody tr:hover td.calc{background:#eef7f2;}

.menu{border:1.4px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:14px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.04);}
.menu .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
.menu .head input.nm{font-size:15px;font-weight:800;color:var(--navy);border:none;border-bottom:2px solid var(--navy);padding:5px 4px;flex:1;min-width:140px;}
.menu .head .pl{font-size:12px;color:var(--mut);font-weight:700;}
.menu .head input.pr{width:110px;font-size:14px;font-weight:700;text-align:right;border:1.3px solid #d6dbe4;border-radius:7px;padding:7px 9px;}
.menu .head .del{margin-left:auto;background:#fdecea;color:var(--red);border:none;border-radius:7px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;}
.res .b{background:#f4f6f9;border-radius:9px;padding:10px;text-align:center;}
.res .b .l{font-size:11px;color:var(--mut);font-weight:700;} .res .b .v{font-size:16px;font-weight:800;color:var(--navy);margin-top:3px;}
.res .b.g .v{color:var(--green);} .res .b.r .v{color:var(--red);}
.badge{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:10px;}
.badge.ok{background:#e6f4ec;color:var(--green);} .badge.no{background:#fdecea;color:var(--red);}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 22px;border-radius:24px;font-size:13.5px;font-weight:700;opacity:0;transition:.25s;z-index:9;}
.toast.on{opacity:1;}
.hide{display:none !important;}
@media(max-width:640px){.res{grid-template-columns:repeat(2,1fr);}}
@media print{.top .btns,.tabs,.mini,.save,.rm,.menu .head .del{display:none !important;}.card,.menu{box-shadow:none;border:1px solid #ddd;}@page{size:A4;margin:12mm;}}
</style>
</head>
<body>
<div class="top">
  <span class="t">🍽️ FNBHERO 원가표</span>
  <span style="font-size:12px;color:#cfd9ec">식자재 직접 입력 · 메뉴 원가 자동 계산</span>
  <div class="btns">
    <button onclick="save()">💾 저장</button>
    <button onclick="doExport()">⬇ 백업</button>
    <label class="mini" style="background:rgba(255,255,255,.16);color:#fff;cursor:pointer">⬆ 가져오기<input type="file" accept=".json" style="display:none" onchange="doImport(this)"></label>
    <button onclick="exportCSV()">CSV</button>
    <button onclick="window.print()">🖨️ 인쇄</button>
  </div>
</div>

<div class="wrap">
  <div class="tabs">
    <button id="tb-ing" class="on" onclick="tab('ing')">① 식자재 (직접 입력)</button>
    <button id="tb-menu" onclick="tab('menu')">② 메뉴 원가</button>
  </div>

  <!-- 식자재 -->
  <div id="pane-ing">
    <div class="card">
      <h3>식자재 마스터</h3>
      <div class="hint">구매가와 구매량을 넣으면 <b>단위원가(원/단위)</b>가 자동 계산됩니다. 예: 삼겹살 1,000g을 12,000원에 구매 → 단위 g, 구매량 1000, 구매가 12,000 → 12원/g.<br>여기에 등록한 식자재를 ② 메뉴 원가에서 골라 씁니다.</div>
      <div style="overflow-x:auto">
      <table id="t-ing">
        <thead><tr>
          <th style="text-align:left;width:26%">식자재명</th><th style="width:16%">구매가(원)</th><th style="width:14%">구매량</th><th style="width:12%">단위</th><th style="width:16%">단위원가</th><th style="width:16%">비고</th><th style="width:34px"></th>
        </tr></thead>
        <tbody></tbody>
      </table>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="mini" onclick="addIng(1)">＋ 행 추가</button>
        <button class="mini" onclick="addIng(5)">＋ 5행</button>
      </div>
    </div>
  </div>

  <!-- 메뉴 원가 -->
  <div id="pane-menu" class="hide">
    <div class="card">
      <h3>메뉴 원가 요약</h3>
      <div style="overflow-x:auto">
      <table id="t-sum">
        <thead><tr><th style="text-align:left">메뉴</th><th>판매가</th><th>원가</th><th>원가율</th><th>마진액</th><th>마진율</th></tr></thead>
        <tbody></tbody>
      </table>
      </div>
    </div>
    <div id="menus"></div>
    <button class="save" onclick="addMenu()">＋ 메뉴 추가</button>
    <div style="height:24px"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY='oksun_costtable_v1';
const $=id=>document.getElementById(id);
const won=n=>Math.round(Number(n)||0).toLocaleString('ko-KR');
const won2=n=>{n=Number(n)||0;return (Math.round(n*100)/100).toLocaleString('ko-KR');};
const num=v=>Number(String(v==null?'':v).replace(/[^0-9.-]/g,''))||0;
let DB={ings:[],menus:[]}, uid=1;
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800);}
function nid(){return 'x'+(uid++);}

/* ===== 저장 ===== */
function collect(){
  DB.ings=[...document.querySelectorAll('#t-ing tbody tr')].map(tr=>({
    id:tr.dataset.id, name:tr.querySelector('.i-name').value, buy:tr.querySelector('.i-buy').value,
    qty:tr.querySelector('.i-qty').value, unit:tr.querySelector('.i-unit').value, memo:tr.querySelector('.i-memo').value }));
  DB.menus=[...document.querySelectorAll('.menu')].map(m=>({
    name:m.querySelector('.nm').value, price:m.querySelector('.pr').value,
    items:[...m.querySelectorAll('.mrow')].map(r=>({ing:r.querySelector('.m-ing').value, qty:r.querySelector('.m-qty').value})) }));
  return DB;
}
function save(){collect();localStorage.setItem(KEY,JSON.stringify(DB));toast('저장되었습니다.');}
function doExport(){collect();const b=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='FNBHERO_원가표_백업.json';a.click();}
function doImport(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{DB=JSON.parse(r.result);renderAll();toast('가져오기 완료');}catch(e){toast('잘못된 파일');}};r.readAsText(f);}

/* ===== 식자재 ===== */
function unitCostOf(id){const ing=DB._ingCache&&DB._ingCache[id];if(!ing)return 0;const q=num(ing.qty);return q?num(ing.buy)/q:0;}
function ingRow(d={}){
  const id=d.id||nid();
  const tr=document.createElement('tr'); tr.dataset.id=id;
  tr.innerHTML='<td class="p"><input class="i-name" placeholder="예: 삼겹살" value="'+(d.name||'')+'"></td>'+
    '<td class="n"><input class="i-buy" inputmode="numeric" placeholder="0" value="'+(d.buy||'')+'"></td>'+
    '<td class="n"><input class="i-qty" inputmode="decimal" placeholder="0" value="'+(d.qty||'')+'"></td>'+
    '<td class="c"><input class="i-unit" placeholder="g" value="'+(d.unit||'')+'" style="text-align:center"></td>'+
    '<td class="calc i-uc">-</td>'+
    '<td class="p"><input class="i-memo" placeholder="" value="'+(d.memo||'')+'"></td>'+
    '<td class="c"><button class="rm" onclick="this.closest(\'tr\').remove();refresh()">✕</button></td>';
  $('t-ing').querySelector('tbody').appendChild(tr);
  return tr;
}
function addIng(n){for(let i=0;i<n;i++)ingRow();refresh();}

/* ===== 메뉴 ===== */
function ingOptions(sel){
  let o='<option value="">— 식자재 선택 —</option>';
  DB.ings.forEach(ing=>{ if(!ing.name)return; o+='<option value="'+ing.id+'"'+(sel===ing.id?' selected':'')+'>'+ing.name+(ing.unit?' ('+ing.unit+')':'')+'</option>'; });
  return o;
}
function menuCard(d={}){
  const wrap=document.createElement('div'); wrap.className='menu';
  wrap.innerHTML=
    '<div class="head"><input class="nm" placeholder="메뉴명" value="'+(d.name||'')+'">'+
      '<span class="pl">판매가</span><input class="pr" inputmode="numeric" placeholder="0" value="'+(d.price||'')+'"><span class="pl">원</span>'+
      '<button class="del" onclick="this.closest(\'.menu\').remove();refresh()">메뉴 삭제</button></div>'+
    '<div style="overflow-x:auto"><table><thead><tr><th style="text-align:left;width:44%">식자재</th><th style="width:20%">사용량</th><th style="width:18%">단위원가</th><th style="width:18%">원가</th><th style="width:34px"></th></tr></thead>'+
    '<tbody class="mbody"></tbody></table></div>'+
    '<button class="mini" style="margin-top:8px" onclick="addMRow(this)">＋ 식자재 추가</button>'+
    '<div class="res"><div class="b"><div class="l">원가 합계</div><div class="v r-cost">-</div></div>'+
      '<div class="b r"><div class="l">원가율</div><div class="v r-rate">-</div></div>'+
      '<div class="b g"><div class="l">마진액</div><div class="v r-margin">-</div></div>'+
      '<div class="b"><div class="l">마진율</div><div class="v r-mrate">-</div></div></div>';
  $('menus').appendChild(wrap);
  const body=wrap.querySelector('.mbody');
  (d.items&&d.items.length?d.items:[{},{}]).forEach(it=>mRow(body,it));
  return wrap;
}
function mRow(body,it={}){
  const tr=document.createElement('tr'); tr.className='mrow';
  tr.innerHTML='<td class="p"><select class="m-ing">'+ingOptions(it.ing)+'</select></td>'+
    '<td class="n"><input class="m-qty" inputmode="decimal" placeholder="0" value="'+(it.qty||'')+'"></td>'+
    '<td class="calc m-uc">-</td><td class="calc m-oc">-</td>'+
    '<td class="c"><button class="rm" onclick="this.closest(\'tr\').remove();refresh()">✕</button></td>';
  body.appendChild(tr);
}
function addMRow(btn){ mRow(btn.previousElementSibling.querySelector('.mbody')||btn.closest('.menu').querySelector('.mbody')); refresh(); }
function addMenu(){menuCard();refresh();}

/* ===== 재계산 ===== */
function refresh(){
  // 식자재 캐시 + 단위원가
  DB._ingCache={};
  document.querySelectorAll('#t-ing tbody tr').forEach(tr=>{
    const id=tr.dataset.id, buy=num(tr.querySelector('.i-buy').value), qty=num(tr.querySelector('.i-qty').value), unit=tr.querySelector('.i-unit').value, name=tr.querySelector('.i-name').value;
    const uc=qty?buy/qty:0;
    tr.querySelector('.i-uc').textContent=qty?won2(uc)+' 원'+(unit?'/'+unit:''):'-';
    DB._ingCache[id]={name,buy,qty,unit,uc};
    DB.ings=DB.ings; // noop
  });
  // ings for dropdown
  DB.ings=Object.keys(DB._ingCache).map(id=>({id,...DB._ingCache[id]}));

  // 드롭다운 옵션 최신화 (선택 유지)
  document.querySelectorAll('.m-ing').forEach(sel=>{ const cur=sel.value; sel.innerHTML=ingOptions(cur); sel.value=cur; });

  // 메뉴별 계산
  const sum=[];
  document.querySelectorAll('.menu').forEach(m=>{
    let cost=0;
    m.querySelectorAll('.mrow').forEach(r=>{
      const id=r.querySelector('.m-ing').value, qty=num(r.querySelector('.m-qty').value);
      const ing=DB._ingCache[id]; const uc=ing?ing.uc:0; const oc=uc*qty;
      r.querySelector('.m-uc').textContent=ing?(won2(uc)+(ing.unit?'/'+ing.unit:'')):'-';
      r.querySelector('.m-oc').textContent=ing&&qty?won(oc)+' 원':'-';
      cost+=oc;
    });
    const price=num(m.querySelector('.pr').value);
    const rate=price?cost/price*100:0, margin=price-cost, mrate=price?margin/price*100:0;
    m.querySelector('.r-cost').textContent=won(cost)+'원';
    m.querySelector('.r-rate').textContent=price?(Math.round(rate*10)/10)+'%':'-';
    m.querySelector('.r-margin').textContent=won(margin)+'원';
    m.querySelector('.r-mrate').textContent=price?(Math.round(mrate*10)/10)+'%':'-';
    m.querySelector('.r-rate').parentElement.querySelector('.v').style.color = rate>40?'var(--red)':'var(--green)';
    sum.push({name:m.querySelector('.nm').value||'(메뉴명 없음)',price,cost,rate,margin,mrate});
  });
  $('t-sum').querySelector('tbody').innerHTML = sum.length? sum.map(s=>
    '<tr><td class="l" style="text-align:left;font-weight:700;color:var(--navy)">'+s.name+'</td><td style="text-align:right">'+won(s.price)+'</td><td style="text-align:right">'+won(s.cost)+
    '</td><td style="text-align:right">'+(s.price?'<span class="badge '+(s.rate>40?'no':'ok')+'">'+(Math.round(s.rate*10)/10)+'%</span>':'-')+
    '</td><td style="text-align:right">'+won(s.margin)+'</td><td style="text-align:right">'+(s.price?(Math.round(s.mrate*10)/10)+'%':'-')+'</td></tr>'
  ).join('') : '<tr><td colspan="6" class="c" style="padding:12px;color:#999">메뉴를 추가하세요.</td></tr>';
}

/* ===== 렌더 ===== */
function renderAll(){
  $('t-ing').querySelector('tbody').innerHTML='';
  (DB.ings&&DB.ings.length?DB.ings:[{},{},{},{},{},{},{},{}]).forEach(d=>ingRow(d));
  $('menus').innerHTML='';
  (DB.menus&&DB.menus.length?DB.menus:[{}]).forEach(d=>menuCard(d));
  refresh();
}
function tab(w){ $('pane-ing').classList.toggle('hide',w!=='ing'); $('pane-menu').classList.toggle('hide',w!=='menu'); $('tb-ing').classList.toggle('on',w==='ing'); $('tb-menu').classList.toggle('on',w==='menu'); refresh(); }
function reset(){}

document.addEventListener('input',e=>{
  if(e.target.matches('.i-buy,.pr')){const v=e.target.value.replace(/[^0-9]/g,'');e.target.value=v?Number(v).toLocaleString('ko-KR'):'';}
  refresh();
});
document.addEventListener('change',e=>{ if(e.target.matches('.m-ing'))refresh(); });

try{const raw=localStorage.getItem(KEY);if(raw){DB=JSON.parse(raw);}}catch(e){}
renderAll();
</script>
</body>
</html>
